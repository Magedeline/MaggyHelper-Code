name: Build MaggyHelper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Checkout LFS objects
      run: git lfs checkout
    
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Celeste dependencies
      run: |
        mkdir -p lib
        curl -fL "https://maddie480.ovh/celeste/everest-deps.zip" -o everest-deps.zip || \
          curl -fL "https://maddie480.ovh/celeste/everest-deps" -o everest-deps.zip
        unzip -tq everest-deps.zip
        unzip everest-deps.zip -d lib
    
    - name: Restore dependencies
      run: dotnet restore Source/MaggyHelper.csproj
      
    - name: Build
      run: |
        dotnet build Source/MaggyHelper.csproj \
          -c Release \
          --no-restore \
          -p:CelestePath=${{ github.workspace }}/lib \
          /p:ReferencePath=${{ github.workspace }}/lib
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MaggyHelper
        path: |
          Code/net8.0/**
          everest.yaml
          Dialog/
          Graphics/
          Loenn/
          Maps/
        if-no-files-found: warn
